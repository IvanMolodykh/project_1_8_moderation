# Локальный стенд: API, Swagger, PostgreSQL и просмотр базы в браузере.
#
# Одна команда из папки backend:
#   docker compose up --build -d --wait
#
# Останов:                         docker compose down
# Полное удаление вместе с данными: docker compose down -v
#
# После старта:
#   Swagger:                 http://localhost:5009/swagger
#   Проверка API и базы:     http://localhost:5009/api/health
#   База в браузере:         http://localhost:8081/?pgsql=&username=postgres&db=moderationdb
#     пароль: postgres
#   Клиент (DBeaver, psql):  localhost:5432, те же учётные данные

name: paper

services:
  postgres:
    image: postgres:16-alpine
    container_name: paper-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moderationdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--data-checksums"

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moderationdb}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: paper-api:local
    container_name: paper-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__Host: postgres
      Database__Port: "5432"
      Database__Database: ${POSTGRES_DB:-moderationdb}
      Database__Username: ${POSTGRES_USER:-postgres}
      Database__Password: ${POSTGRES_PASSWORD:-postgres}
      Database__SslMode: Disable
      Database__CreateSchemaOnStartup: "true"
      Database__SeedData: "true"

    ports:
      - "${API_PORT:-5009}:8080"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  adminer:
    image: adminer:4
    container_name: paper-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ADMINER_DEFAULT_SERVER: postgres

    ports:
      - "${ADMINER_PORT:-8081}:8080"

volumes:
  pgdata:
